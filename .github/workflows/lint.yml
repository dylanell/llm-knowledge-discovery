name: Lint

on:
  pull_request:
    branches: [main, dev]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Run ruff check
        run: uv run ruff check .
