[project]
name = "llm-knowledge-discovery"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.14",
    "pymongo>=4.6",
    "python-dotenv>=1.0",
    "anthropic>=0.34",
    "biopython>=1.83",
    "pydantic>=2.6",
    "requests>=2.31",
]

[project.scripts]
llm-knowledge-discovery = "llm_knowledge_discovery:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = ["E", "F", "W"]  # pycodestyle errors/warnings + pyflakes (PEP8 core)

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]  # imports after load_dotenv() is intentional in notebooks

[dependency-groups]
dev = [
    "ruff>=0.15.5",
]
