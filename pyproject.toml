[project]
name = "llm-knowledge-discovery"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.14",
    "pymongo>=4.6",
    "python-dotenv>=1.0",
    "anthropic>=0.34",
    "biopython>=1.83",
    "pydantic>=2.6",
    "requests>=2.31",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-chroma>=0.2",
    "chromadb>=0.6.3,<0.7",
    "langchain-huggingface>=0.1",
    "sentence-transformers>=2.2,<3",
    "torch>=2.0,<2.3",
    "onnxruntime<1.20",
    "numpy>=1.24,<2",
]

[project.scripts]
llm-knowledge-discovery = "llm_knowledge_discovery:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = ["E", "F", "W"]  # pycodestyle errors/warnings + pyflakes (PEP8 core)

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402", "E501"]  # E402: imports after load_dotenv(); E501: string literals in notebook cells are impractical to wrap

[dependency-groups]
dev = [
    "ruff>=0.15.5",
]
